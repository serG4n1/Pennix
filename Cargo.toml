[package]
name = "pennix-linux"
version = "1.0.0"
edition = "2021"
description = "Pennix для Linux (X11): скрытие окон и иконок трея приложений по горячей клавише"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "default_fonts"] }
x11rb = { version = "0.14", features = ["xkb"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
